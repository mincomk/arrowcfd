[package]
name = "bot"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.22.1"
cubecl = { version = "0.10.0", features = ["cpu"] }
dotenvy = "0.15.7"
engine = { version = "0.1.0", path = "../engine" }
poise = "0.6.2"
regex = "1.12.3"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls"] }
serde_json = "1.0.150"
serenity = "0.12.5"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread"] }
